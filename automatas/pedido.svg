<svg xmlns="http://www.w3.org/2000/svg" width="980" height="286" viewBox="0 0 980 286"><rect width="100%" height="100%" fill="#f6f8fb"/><text x="24" y="25" font-size="20" font-weight="bold">Pedido · q₀=Borrador · F=Entregado, Cancelado</text><text x="24" y="42" font-size="16">Borrador —confirmar→ Confirmado</text><text x="24" y="66" font-size="16">Confirmado —reservar→ Reservado</text><text x="24" y="90" font-size="16">Reservado —preparar→ Preparación</text><text x="24" y="114" font-size="16">Preparación —empacar→ Empacado</text><text x="24" y="138" font-size="16">Empacado —despachar→ Despachado</text><text x="24" y="162" font-size="16">Despachado —entregar→ Entregado</text><text x="24" y="186" font-size="16">Borrador —cancelar→ Cancelado</text><text x="24" y="210" font-size="16">Confirmado —cancelar→ Cancelado</text><text x="24" y="234" font-size="16">Reservado —cancelar→ Cancelado</text></svg>