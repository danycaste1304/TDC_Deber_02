<svg xmlns="http://www.w3.org/2000/svg" width="980" height="238" viewBox="0 0 980 238"><rect width="100%" height="100%" fill="#f6f8fb"/><text x="24" y="25" font-size="20" font-weight="bold">Compra · q₀=Borrador · F=Cerrada, Rechazada, Cancelada</text><text x="24" y="42" font-size="16">Borrador —aprobar→ Aprobada</text><text x="24" y="66" font-size="16">Aprobada —enviar→ Enviada</text><text x="24" y="90" font-size="16">Enviada —recibir→ Recibida</text><text x="24" y="114" font-size="16">Recibida —cerrar→ Cerrada</text><text x="24" y="138" font-size="16">Borrador —rechazar→ Rechazada</text><text x="24" y="162" font-size="16">Borrador —cancelar→ Cancelada</text><text x="24" y="186" font-size="16">Aprobada —cancelar→ Cancelada</text></svg>